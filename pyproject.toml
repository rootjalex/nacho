[build-system]
requires = [
    "scikit-build-core >=0.10",
    "nanobind >=1.3.2",
    "cmake >=3.30",
    "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "nacho"
version = "0.1.0"
description = "Python bindings for kernels generated by the nacho sparse tensor compiler"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
benchmarks = ["numpy", "scipy", "pandas", "torch"]

[tool.scikit-build]
minimum-version = "build-system.requires"

# The extension build lives in python/; the top-level CMakeLists builds the compiler
# itself and deliberately does not depend on CUDA.
cmake.source-dir = "python"
build-dir = "build-py/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["python/nacho"]
